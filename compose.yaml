version: '3.8'

services:
  php:
    build: ./docker/php
    container_name: web24-assessment_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - web24-assessment_network

  nginx:
    image: nginx:alpine
    container_name: web24-assessment_nginx
    ports:
      - '8080:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: 
      - php
    networks:
      - web24-assessment_network

  db:
    image: mysql:8.0
    container_name: web24-assessment_db
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: web24-assessment_api
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_TEST_DATABASE: web24-assessment_api_test
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      start_period: 60s
      timeout: 5s
      retries: 5
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d
    networks:
      - web24-assessment_network

volumes:
  database_data:

networks:
  web24-assessment_network:
    driver: bridge